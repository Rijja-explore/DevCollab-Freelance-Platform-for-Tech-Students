server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: escrow-service
  profiles:
    default: docker

  # ─────────────────────────────────────────────────────────
  #  Datasource
  # ─────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/escrow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: escrow_user
    password: escrow_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EscrowHikariPool

  # ─────────────────────────────────────────────────────────
  #  JPA / Hibernate
  # ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ─────────────────────────────────────────────────────────
  #  Flyway
  # ─────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─────────────────────────────────────────────────────────
  #  RabbitMQ
  # ─────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
        prefetch: 10
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

  # ─────────────────────────────────────────────────────────
  #  Jackson
  # ─────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# ─────────────────────────────────────────────────────────
#  JWT (RS256) — Public Key from Service A's JWKS
# ─────────────────────────────────────────────────────────
jwt:
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
  issuer: ${JWT_ISSUER:devcollab-auth}
  expiration-ms: 3600000

# ─────────────────────────────────────────────────────────
#  Payment Provider
# ─────────────────────────────────────────────────────────
# payment.provider selects the implementation:
#   razorpay → Razorpay TEST MODE API
#   paypal   → PayPal Checkout REST API
#   mock     → offline/demo provider (default)
payment:
  provider: ${PAYMENT_PROVIDER:mock}

# ─────────────────────────────────────────────────────────
#  Razorpay
# ─────────────────────────────────────────────────────────
razorpay:
  key-id: ${PAYMENT_PROVIDER_KEY:rzp_test_placeholder}
  key-secret: ${PAYMENT_PROVIDER_SECRET:rzp_secret_placeholder}
  webhook-secret: ${WEBHOOK_SECRET:whsec_placeholder}
  currency: ${RAZORPAY_CURRENCY:INR}

# ─────────────────────────────────────────────────────────
#  PayPal
# ─────────────────────────────────────────────────────────
paypal:
  client-id: ${PAYPAL_CLIENT_ID:placeholder}
  client-secret: ${PAYPAL_CLIENT_SECRET:placeholder}
  mode: ${PAYPAL_MODE:sandbox}
  currency: ${PAYPAL_CURRENCY:USD}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  base-url: ${PAYPAL_BASE_URL:}
  return-url: ${PAYPAL_RETURN_URL:http://localhost:5173/milestones?payment=success}
  cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:5173/milestones?payment=cancelled}

# ─────────────────────────────────────────────────────────
#  DevCollab Escrow Config
# ─────────────────────────────────────────────────────────
escrow:
  exchange: devcollab.events
  queues:
    project-matched: q.project.matched
    milestone-completed: q.milestone.completed
  routing-keys:
    project-matched: project.matched
    milestone-completed: milestone.completed
    payment-released: payment.released
    payment-failed: payment.failed
  dlx:
    exchange: devcollab.events.dlx
    queue: q.dead.letter

# ─────────────────────────────────────────────────────────
#  Actuator
# ─────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    rabbitmq:
      enabled: true

# ─────────────────────────────────────────────────────────
#  SpringDoc / Swagger UI
# ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true

logging:
  level:
    com.devcollab.escrow: DEBUG
    org.springframework.amqp: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
