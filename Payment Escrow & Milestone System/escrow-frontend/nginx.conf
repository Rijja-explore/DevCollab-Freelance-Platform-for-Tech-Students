# React SPA serving with backend API reverse-proxy (Docker Compose)
# The frontend container talks to the backend container via its service name.

server {
    listen 80;
    server_name localhost;

    # ── Backend API reverse-proxy ───────────────────────────────────────────
    # The SPA uses relative /api/* paths. Proxy them to the escrow-service
    # backend so the browser never needs to know the backend host:port.
    location /api/ {
        proxy_pass http://escrow-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ── Static SPA ──────────────────────────────────────────────────────────
    # React Router history-mode fallback: any non-file route → index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames in dist/assets).
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

