server:
  port: 8081
spring:
  application:
    name: devcollab-auth
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_pass}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
jwt:
  issuer: ${JWT_ISSUER:devcollab-auth}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
