server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-discovery}:5432/${DB_NAME:discovery_db}
    username: ${DB_USERNAME:discovery_user}
    password: ${DB_PASSWORD:discovery_pass}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
